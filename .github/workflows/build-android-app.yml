name: Build Android app

on:
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - "tools/write_android_app_manifest.py"
      - ".github/workflows/build-android-app.yml"
  workflow_dispatch:
    inputs:
      changelog:
        description: "Changelog shown in the Android app"
        required: false
        default: "Android app build from GitHub Actions"
      required:
        description: "Mark update as required"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode release keystore
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KESP32_KEYSTORE_BASE64 || secrets.KEPS32V1_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KESP32_KEYSTORE_PASSWORD || secrets.KEPS32V1_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KESP32_KEY_ALIAS || secrets.KEPS32V1_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KESP32_KEY_PASSWORD || secrets.KEPS32V1_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are incomplete; building debug APK only."
            exit 0
          fi
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Missing KESP32_KEYSTORE_BASE64; building debug APK only."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kesp32-release.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME="$(grep -E 'versionName "' android-app/app/build.gradle | sed -E 's/.*versionName "([^"]+)".*/\1/')"
          VERSION_CODE="$(grep -E 'versionCode [0-9]+' android-app/app/build.gradle | sed -E 's/.*versionCode ([0-9]+).*/\1/')"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        working-directory: android-app
        env:
          KESP32_KEYSTORE_FILE: ${{ runner.temp }}/kesp32-release.jks
          KESP32_KEYSTORE_PASSWORD: ${{ secrets.KESP32_KEYSTORE_PASSWORD || secrets.KEPS32V1_KEYSTORE_PASSWORD }}
          KESP32_KEY_ALIAS: ${{ secrets.KESP32_KEY_ALIAS || secrets.KEPS32V1_KEY_ALIAS }}
          KESP32_KEY_PASSWORD: ${{ secrets.KESP32_KEY_PASSWORD || secrets.KEPS32V1_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Build debug APK
        if: steps.signing.outputs.signed != 'true'
        working-directory: android-app
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Publish app files in repo
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        run: |
          VERSION_NAME="${{ steps.version.outputs.name }}"
          VERSION_CODE="${{ steps.version.outputs.code }}"
          CHANGELOG="${{ github.event.inputs.changelog || 'KESP32 app build from GitHub Actions' }}"
          APK_NAME="KESP32-${VERSION_NAME}.apk"
          REQUIRED_FLAG=""
          if [ "${{ inputs.required }}" = "true" ]; then
            REQUIRED_FLAG="--required"
          fi
          mkdir -p android-app/releases
          cp android-app/app/build/outputs/apk/release/app-release.apk "android-app/releases/${APK_NAME}"
          python tools/write_android_app_manifest.py \
            --apk "android-app/releases/${APK_NAME}" \
            --version-name "$VERSION_NAME" \
            --version-code "$VERSION_CODE" \
            --output android-app/latest.json \
            --changelog "$CHANGELOG" \
            $REQUIRED_FLAG
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/latest.json "android-app/releases/${APK_NAME}"
          git diff --cached --quiet || git commit -m "Publish Android app ${VERSION_NAME}"
          git push

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: KESP32-${{ steps.version.outputs.name }}
          path: |
            android-app/latest.json
            android-app/releases/KESP32-${{ steps.version.outputs.name }}.apk
            android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
