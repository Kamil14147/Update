name: Build ESP32 firmware

on:
  push:
    branches:
      - main
    paths:
      - "esp32/KejmilOLED/**"
      - "tools/write_firmware_manifest.py"
      - ".github/workflows/build-esp32-firmware.yml"
  workflow_dispatch:
    inputs:
      changelog:
        description: "Changelog shown in the Android app"
        required: false
        default: "Firmware build from GitHub Actions"
      required:
        description: "Mark update as required"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "ArduinoJson"

      - name: Read firmware version
        id: version
        shell: bash
        run: |
          VERSION="$(grep -E 'FW_VERSION = "' esp32/KejmilOLED/KejmilOLED.ino | sed -E 's/.*FW_VERSION = "([^"]+)".*/\1/')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compile firmware
        run: |
          mkdir -p firmware/build firmware/releases
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --output-dir firmware/build \
            esp32/KejmilOLED

      - name: Publish firmware files in repo
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BIN_NAME="kejmil-oled-esp32-${VERSION}.bin"
          REQUIRED_FLAG=""
          if [ "${{ inputs.required }}" = "true" ]; then
            REQUIRED_FLAG="--required"
          fi
          cp firmware/build/KejmilOLED.ino.bin "firmware/releases/${BIN_NAME}"
          python tools/write_firmware_manifest.py \
            --bin "firmware/releases/${BIN_NAME}" \
            --version "$VERSION" \
            --output firmware/latest.json \
            --changelog "${{ inputs.changelog }}" \
            $REQUIRED_FLAG
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/latest.json "firmware/releases/${BIN_NAME}"
          git diff --cached --quiet || git commit -m "Publish ESP32 firmware ${VERSION}"
          git push

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: kejmil-oled-esp32-${{ steps.version.outputs.version }}
          path: |
            firmware/latest.json
            firmware/releases/kejmil-oled-esp32-${{ steps.version.outputs.version }}.bin
