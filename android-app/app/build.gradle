plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def envOrLegacy(String key, String legacyKey) {
    return System.getenv(key) ?: System.getenv(legacyKey)
}

def releaseStoreFile = envOrLegacy("KESP32_KEYSTORE_FILE", "KEPS32V1_KEYSTORE_FILE")
def releaseStorePassword = envOrLegacy("KESP32_KEYSTORE_PASSWORD", "KEPS32V1_KEYSTORE_PASSWORD")
def releaseKeyAlias = envOrLegacy("KESP32_KEY_ALIAS", "KEPS32V1_KEY_ALIAS")
def releaseKeyPassword = envOrLegacy("KESP32_KEY_PASSWORD", "KEPS32V1_KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace "pl.kejmil.oledsender"
    compileSdk 36

    defaultConfig {
        applicationId "pl.kejmil.oledsender"
        minSdk 23
        targetSdk 36
        versionCode 8
        versionName "1.7"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}
